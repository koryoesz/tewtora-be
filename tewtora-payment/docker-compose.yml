services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: tewtora_payment
    ports:
      - "3307:3306"
    volumes:
      - tewtora_payment_mysqldata:/var/lib/mysql

  # Dedicated instance for `php artisan test` / phpunit.xml — kept separate
  # from the `mysql` service above so tests never touch dev data.
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: tewtora_payment_test
    ports:
      - "3317:3306"
    tmpfs:
      - /var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  tewtora_payment_mysqldata:
